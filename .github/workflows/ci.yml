# This is a basic workflow to help you get started with Actions

name: test

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the develop branch
  push:
    branches: [master, develop]
    tags:
      - "*"
  pull_request:
    branches: [master, develop]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "pnpm_cache_dir=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.pnpm_cache_dir }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('package.json', 'pnpm-workspace.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chrome for Puppeteer
        # Resolve the puppeteer-core actually used by @web/test-runner-chrome and
        # install the exact Chrome build it expects. Pinning to that version avoids
        # drift between the puppeteer used to install Chrome and the puppeteer-core
        # used to launch it when `pnpm install --no-frozen-lockfile` pulls newer
        # transitive versions on CI.
        run: |
          set -euo pipefail
          CHROME_VERSION=$(node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const wtrPuppeteer = fs.realpathSync(path.join(process.cwd(), "node_modules", "@web", "test-runner-puppeteer"));
            const wtrChrome = fs.realpathSync(path.join(wtrPuppeteer, "..", "..", "@web", "test-runner-chrome"));
            const puppeteerCore = fs.realpathSync(path.join(wtrChrome, "..", "..", "puppeteer-core"));
            const revisionFiles = [
              "lib/puppeteer/revisions.js",
              "lib/cjs/puppeteer/revisions.js",
            ];
            const revisionsPath = revisionFiles
              .map((relativePath) => path.join(puppeteerCore, relativePath))
              .find((candidatePath) => fs.existsSync(candidatePath));
            if (!revisionsPath) throw new Error("Could not find puppeteer revisions.js");
            const { PUPPETEER_REVISIONS } = require(revisionsPath);
            process.stdout.write(PUPPETEER_REVISIONS.chrome);
          ')
          echo "Installing Chrome ${CHROME_VERSION} into ${HOME}/.cache/puppeteer"
          pnpm dlx @puppeteer/browsers install "chrome@${CHROME_VERSION}" --path "${HOME}/.cache/puppeteer"

      - name: Test with Node.js
        run: pnpm test

      - name: Test with web-test-runner
        run: pnpm test:web

      - name: Install lcov and merge coverage info
        run: |
          sudo apt install lcov
          find ./coverage  -name lcov.info -exec echo -a {} \; | xargs lcov -o ./coverage/merged-lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/merged-lcov.info

  publish:
    needs: test
    if: startsWith(github.event.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          # Defaults to the user or organization that owns the workflow file
          scope: "@octocat"
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.17.0
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
